<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>위장 게이지 대결</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root { --bg: #241f3d; --card: #fffaf0; --accent: #0f6e56; --danger: #c62d3a; --warn: #854f0b; --neon: #ffd43b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Do Hyeon', -apple-system, "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #3a3164 0%, #241f3d 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 14px);
    color: #2c2c2a; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 20px;
    transition: background .3s;
  }
  body.warning { background: #4a1616; animation: flash 0.6s infinite alternate; }
  @keyframes flash { from { box-shadow: inset 0 0 0 6px #ff6b6b; } to { box-shadow: inset 0 0 0 6px transparent; } }
  @keyframes comboPulse { 0% { transform: scale(1.5); color: #ffd43b; } 100% { transform: scale(1); } }
  body.office { background: #e9eaec; }
  .topbar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--neon); margin-bottom: 12px; padding: 8px 14px; background: #1a1633; border: 2px solid #4a3f7a; border-radius: 12px; text-shadow: 0 0 6px rgba(255,212,59,0.6); }
  .topbar span { display: flex; align-items: center; gap: 5px; }
  .panel { width: 100%; max-width: 480px; background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 3px solid #2c2c2a; box-shadow: 0 4px 0 #2c2c2a, 0 6px 14px rgba(0,0,0,0.35); }
  .gauge-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; font-size: 17px; }
  .board-track { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .board-end { font-size: 22px; flex-shrink: 0; }
  .board-end-office { color: #444441; }
  .board-end-beach { color: #3b6d11; }
  .board-tiles { flex: 1; display: flex; gap: 4px; position: relative; }
  .board-tile { flex: 1; height: 30px; background: #1a1633; border: 2px solid #2c2c2a; border-radius: 6px; position: relative; }
  .board-tile.filled { background: linear-gradient(180deg, #4ce0a3, #0f6e56); }
  .board-tile.trap { box-shadow: 0 0 0 3px #ffd43b inset; }
  .board-tile.trap::after { content: "⚠"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .board-token { position: absolute; top: -6px; width: 30px; height: 30px; border-radius: 50%; background: #fff3d6; border: 3px solid #2c2c2a; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: left .35s ease; z-index: 2; }
  .oppo-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 999px; background: #fbeaf0; color: #72243e; margin-top: 8px; border: 2px solid #72243e; }
  .card-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 999px; margin-bottom: 12px; border: 2px solid currentColor; }
  .badge-tier1 { background: #eaf3de; color: #27500a; }
  .badge-tier2 { background: #faeeda; color: #633806; }
  .badge-tier3 { background: #faece7; color: #712b13; }
  .badge-tier4 { background: #fbeaf0; color: #4b1528; }
  .prompt { text-align: center; font-size: 24px; font-weight: 400; margin: 6px 0 20px; min-height: 60px; font-family: 'Jua', 'Do Hyeon', sans-serif; }
  .options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .opt-btn { min-width: 76px; height: 76px; border-radius: 16px; border: 3px solid #2c2c2a; background: #fff; font-size: 17px; font-weight: 700; font-family: 'Jua', sans-serif; cursor: pointer; box-shadow: 0 4px 0 #2c2c2a; transition: transform .08s, box-shadow .08s; }
  .opt-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #2c2c2a; }
  .opt-btn.foot { height: 98px; min-width: 86px; background: #e1f5ee; border-color: #0f6e56; box-shadow: 0 4px 0 #0f6e56; }
  .opt-btn.foot:active { box-shadow: 0 0 0 #0f6e56; }
  .actions { display: flex; gap: 10px; width: 100%; max-width: 480px; }
  .btn { flex: 1; padding: 16px; border-radius: 14px; border: 3px solid #2c2c2a; font-size: 16px; font-weight: 700; font-family: 'Jua', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 #2c2c2a; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #2c2c2a; }
  .btn-throw { background: #4ce0a3; color: #063d2c; }
  .btn-defend { background: #ff8787; color: #4a1616; }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: 0 4px 0 #2c2c2a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .incoming { position: fixed; top: 0; left: 0; right: 0; background: var(--danger); color: #fff; text-align: center; padding: 14px; font-weight: 700; z-index: 10; }
  .result-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 20; gap: 6px; }
  .result-screen.win { background: #eaf3de; }
  .result-screen.lose { background: #e9eaec; }
  .result-screen h1 { font-size: 30px; margin: 0; font-family: 'Jua', sans-serif; }
  #resultIcon { font-size: 96px; margin-bottom: 4px; }
  .result-screen.win #resultIcon { color: #3b6d11; }
  .result-screen.lose #resultIcon { color: #444441; }
  .stamp {
    font-size: 20px; font-weight: 800; padding: 10px 26px; margin-top: 14px;
    border: 4px double currentColor; border-radius: 12px; transform: rotate(-6deg);
    letter-spacing: 2px;
  }
  .result-screen.win .stamp { color: #3b6d11; }
  .result-screen.lose .stamp { color: #a32d2d; }
  .hidden { display: none !important; }
  .feedback { font-size: 14px; text-align: center; height: 20px; color: var(--accent); font-weight: 600; }
  .speech-bubble {
    position: relative; display: inline-block; background: #fff3d6;
    border: 4px solid #2c2c2a; border-radius: 20px; padding: 16px 40px;
    font-size: 36px; font-weight: 400; font-family: 'Jua', sans-serif;
    margin: 10px auto 30px; color: #412402;
    box-shadow: 0 5px 0 #2c2c2a, 0 0 0 6px #ffd43b, 0 0 0 9px #2c2c2a;
  }
  .speech-bubble::after { content: ""; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); border-width: 18px 13px 0; border-style: solid; border-color: #2c2c2a transparent transparent; }
  .speech-bubble::before { content: ""; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); border-width: 14px 10px 0; border-style: solid; border-color: #fff3d6 transparent transparent; z-index: 1; }
  .bubble-wrap { text-align: center; padding-top: 10px; }
  .opt-emoji { display: flex; justify-content: center; margin-bottom: 4px; }
  .opt-emoji img { display: block; width: 46px; height: 46px; object-fit: contain; }
  .opt-key { font-size: 10px; color: var(--text-muted, #999); display: block; margin-top: 2px; }
  .feedback.bad { color: var(--danger); }
  .feedback { font-family: 'Jua', sans-serif; }
  h2, .card-badge, .oppo-badge { font-family: 'Jua', sans-serif; }
</style>
</head>
<body>
  <div class="topbar">
    <span><i class="ti ti-clock"></i> <span id="phaseLabel">대기중</span></span>
    <span id="comboLabel" class="hidden"><i class="ti ti-flame"></i> <span id="comboNum">0</span> 콤보</span>
    <span><i class="ti ti-bolt"></i> <span id="stackLabel">간섭스택 0</span></span>
  </div>

  <div class="panel">
    <div class="gauge-row"><span>내 위장 게이지</span><span id="gaugeNum">100</span></div>
    <div class="board-track" id="boardTrack">
      <i class="ti ti-briefcase board-end board-end-office"></i>
      <div class="board-tiles" id="boardTiles">
        <div class="board-token" id="boardToken"><i class="ti ti-run"></i></div>
      </div>
      <i class="ti ti-beach board-end board-end-beach"></i>
    </div>
  </div>

  <div class="panel">
    <div class="gauge-row" style="margin-bottom:2px;"><span>상대</span><span id="oppoState">플레이 중</span></div>
    <span class="oppo-badge hidden" id="oppoWarning"><i class="ti ti-flame"></i> 상대 경고모드</span>
  </div>

  <div class="panel">
    <div id="cardBadge" class="card-badge hidden"></div>
    <div class="prompt" id="prompt">대기 중...</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="actions">
    <button class="btn btn-throw" id="throwBtn" disabled><i class="ti ti-send"></i> 방해 카드 던지기</button>
    <button class="btn btn-defend hidden" id="defendBtn"><i class="ti ti-shield"></i> 방어!</button>
  </div>

  <div class="result-screen hidden" id="resultScreen">
    <i class="ti" id="resultIcon"></i>
    <h1 id="resultTitle"></h1>
    <div class="stamp" id="resultStamp"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const role = params.get('role') === '2' ? '2' : '1';
  const socket = io({ query: { role } });
  let myId = role === '2' ? 2 : 1;
  let currentRound = null;

  socket.on('assigned', ({ id }) => { myId = id; });

  socket.on('round', (round) => {
    currentRound = round;
    document.getElementById('feedback').textContent = '';
    renderRound(round);
  });

  const TIER_ICON = { 1: 'ti-mood-smile', 2: 'ti-flame', 3: 'ti-bolt', 4: 'ti-skull' };
  const HAND_IMG = {
    가위: '/assets/gawi.png',
    바위: '/assets/bawi.png',
    보: '/assets/bo.png',
  };
  let activeButtons = [];

  function renderRound(round) {
    const badge = document.getElementById('cardBadge');
    badge.classList.remove('hidden');
    badge.className = 'card-badge badge-tier' + round.tier;
    badge.innerHTML = `<i class="ti ${TIER_ICON[round.tier] || 'ti-bolt'}"></i> ${round.cardName}`;

    const promptEl = document.getElementById('prompt');
    const isFoot = round.cardId === 'giboo';
    if (isFoot) {
      promptEl.innerHTML = `<div class="bubble-wrap"><span class="speech-bubble">${round.bubble}!</span></div>`;
    } else if (round.cardId === 'colorword' && round.wordColorHex) {
      promptEl.innerHTML = `<span style="color:${round.wordColorHex}; font-weight:700;">${round.prompt}</span>`;
    } else {
      promptEl.textContent = round.prompt;
    }

    const optsEl = document.getElementById('options');
    optsEl.innerHTML = '';
    activeButtons = [];
    round.options.forEach((opt, idx) => {
      const label = typeof opt === 'object' ? opt.label : opt;
      const btn = document.createElement('button');
      btn.className = 'opt-btn' + (isFoot ? ' foot' : '');
      if (isFoot && HAND_IMG[label]) {
        btn.innerHTML = `<span class="opt-emoji"><img src="${HAND_IMG[label]}" alt="${label}" /></span>${label}<span class="opt-key">${idx + 1}</span>`;
      } else {
        btn.innerHTML = `${label}<span class="opt-key">${idx + 1}</span>`;
      }
      btn.onclick = () => submitAnswer(label);
      optsEl.appendChild(btn);
      activeButtons.push(btn);
    });
  }

  document.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= activeButtons.length) {
      activeButtons[n - 1].click();
    }
  });

  function submitAnswer(value) {
    if (!currentRound) return;
    const correct = String(value) === String(currentRound.correct);
    const fb = document.getElementById('feedback');
    fb.textContent = correct ? '성공! 계속 위장 중' : '앗, 본능이 나와버렸다';
    fb.className = 'feedback' + (correct ? '' : ' bad');
    socket.emit('answer', value);
    currentRound = null;
    activeButtons = [];
    document.getElementById('options').innerHTML = '';
    document.getElementById('prompt').textContent = '...';
  }

  socket.on('publicState', (s) => updateUI(s));
  socket.on('state', (s) => updateUI(s)); // admin에서도 재사용 가능하도록

  const TILE_COUNT = 10;
  (function initBoard() {
    const tilesEl = document.getElementById('boardTiles');
    for (let i = 0; i < TILE_COUNT; i++) {
      const t = document.createElement('div');
      t.className = 'board-tile';
      tilesEl.appendChild(t);
    }
  })();

  function updateUI(s) {
    document.getElementById('phaseLabel').textContent = s.phaseLabel || '대기중';
    const me = myId === 1 ? s.p1 : s.p2;
    const oppo = myId === 1 ? s.p2 : s.p1;
    if (!me) return;

    document.getElementById('gaugeNum').textContent = Math.round(me.gauge);
    const filledCount = Math.round((me.gauge / 100) * TILE_COUNT);
    const tiles = document.querySelectorAll('#boardTiles .board-tile');
    tiles.forEach((t, i) => {
      t.classList.toggle('filled', i < filledCount);
      t.classList.toggle('trap', me.hasForcedCard && i === filledCount);
    });
    const token = document.getElementById('boardToken');
    const pct = (filledCount / TILE_COUNT) * 100;
    token.style.left = `calc(${pct}% - 15px)`;
    document.body.classList.toggle('warning', me.warning && !me.defeated);

    document.getElementById('stackLabel').textContent = '간섭스택 ' + Math.floor(me.stack);
    document.getElementById('throwBtn').disabled = me.stack < 1 || me.defeated || oppo.defeated;

    const comboLabel = document.getElementById('comboLabel');
    if (me.combo > 0) {
      comboLabel.classList.remove('hidden');
      const numEl = document.getElementById('comboNum');
      if (numEl.textContent !== String(me.combo)) {
        numEl.textContent = me.combo;
        comboLabel.style.animation = 'none';
        void comboLabel.offsetWidth;
        comboLabel.style.animation = 'comboPulse .35s ease';
      }
    } else {
      comboLabel.classList.add('hidden');
    }

    document.getElementById('oppoState').textContent = oppo.defeated ? '패배함' : (oppo.warning ? '위험!' : '플레이 중');
    document.getElementById('oppoWarning').classList.toggle('hidden', !oppo.warning || oppo.defeated);
  }

  document.getElementById('throwBtn').onclick = () => socket.emit('throwInterference');
  document.getElementById('defendBtn').onclick = () => {
    socket.emit('defend');
    document.getElementById('defendBtn').classList.add('hidden');
  };

  socket.on('incoming', ({ cardName, previewMs }) => {
    const bar = document.createElement('div');
    bar.className = 'incoming';
    bar.textContent = `${cardName} 카드 도착! (${(previewMs/1000).toFixed(1)}초)`;
    document.body.appendChild(bar);
    document.getElementById('defendBtn').classList.remove('hidden');
    setTimeout(() => { bar.remove(); document.getElementById('defendBtn').classList.add('hidden'); }, previewMs);
  });

  socket.on('specialEvent', ({ cardName, label }) => {
    const bar = document.createElement('div');
    bar.className = 'incoming';
    bar.style.background = '#4b1528';
    bar.textContent = `특수 이벤트: ${label}!`;
    document.body.appendChild(bar);
    setTimeout(() => bar.remove(), 2200);
  });

  socket.on('defeated', () => {
    document.body.classList.add('office');
    showResult(false);
  });
  socket.on('opponentDefeated', () => {
    // 계속 진행, 알림만
    const fb = document.getElementById('feedback');
    fb.textContent = '상대가 발각되었습니다! 계속 진행하세요';
  });

  socket.on('gameOver', ({ winner }) => {
    showResult(winner === myId);
  });

  function showResult(won) {
    const el = document.getElementById('resultScreen');
    el.classList.remove('hidden');
    el.classList.add(won ? 'win' : 'lose');
    document.getElementById('resultIcon').className = 'ti ' + (won ? 'ti-beach' : 'ti-briefcase');
    document.getElementById('resultTitle').textContent = won ? '바보 인증 성공' : '정체 발각';
    document.getElementById('resultStamp').textContent = won ? '생존' : '출근 확정';
  }
</script>
</body>
</html>
